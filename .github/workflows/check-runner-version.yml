name: Check Runner Version and Deprecation

on:
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current runner version
        id: current
        shell: bash
        run: |
          VERSION=$(grep -oP 'ARG RUNNER_VERSION="\K[^"]+' Dockerfile)

          echo "Current runner version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest runner version
        id: latest
        shell: bash
        run: |
          LATEST=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/actions/runner/releases/latest" \
            | jq -r '.tag_name' \
            | sed 's/^v//')

          echo "Latest runner version: $LATEST"

          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare runner versions
        id: compare
        shell: bash
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          echo "Current Version: $CURRENT"
          echo "Latest Version: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Runner is using the latest version."
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Runner version update available."

          echo "update_available=true" >> "$GITHUB_OUTPUT"

      - name: Check deprecation schedule
        id: deprecation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_RUNNER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          echo "Checking deprecation schedule..."

          echo "Repository: $REPOSITORY"
          echo "Runner Version: $CURRENT_VERSION"

          RESPONSE=$(curl -sL \
            -w "\n%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runners/deprecations/${CURRENT_VERSION}")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "GitHub API HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then

            DEPRECATION_DATE=$(echo "$BODY" | jq -r '.runtime_deprecates_at')

            echo "Deprecation date: $DEPRECATION_DATE"

            DEPRECATION_DATE_ONLY=$(echo "$DEPRECATION_DATE" | cut -d'T' -f1)

            TODAY=$(date -u +"%Y-%m-%d")

            TODAY_SECONDS=$(date -d "$TODAY" +%s)
            DEPRECATION_SECONDS=$(date -d "$DEPRECATION_DATE_ONLY" +%s)

            DAYS_REMAINING=$(( \
              (DEPRECATION_SECONDS - TODAY_SECONDS) / 86400 \
            ))

            echo "Days remaining: $DAYS_REMAINING"

            echo "deprecated=true" >> "$GITHUB_OUTPUT"
            echo "deprecation_date=$DEPRECATION_DATE_ONLY" >> "$GITHUB_OUTPUT"
            echo "days_remaining=$DAYS_REMAINING" >> "$GITHUB_OUTPUT"

          elif [ "$HTTP_STATUS" = "404" ]; then

            echo "No EOL record found for runner version $CURRENT_VERSION."

            echo "deprecated=false" >> "$GITHUB_OUTPUT"
            echo "deprecation_date=" >> "$GITHUB_OUTPUT"
            echo "days_remaining=" >> "$GITHUB_OUTPUT"

          else

            echo "ERROR: Unable to retrieve deprecation information."
            echo "$BODY"

            exit 1
          fi

      - name: Display result
        shell: bash
        run: |
          echo "======================================"
          echo "GitHub Actions Runner Status"
          echo "======================================"

          echo "Current Version: ${{ steps.current.outputs.version }}"
          echo "Latest Version: ${{ steps.latest.outputs.version }}"

          if [ "${{ steps.deprecation.outputs.deprecated }}" = "true" ]; then
            echo "Deprecation Date: ${{ steps.deprecation.outputs.deprecation_date }}"
            echo "Days Remaining: ${{ steps.deprecation.outputs.days_remaining }}"
          else
            echo "Deprecation Date: No EOL record"
          fi

          echo "======================================"

      - name: Send Teams notification
        if: steps.compare.outputs.update_available == 'true' || steps.deprecation.outputs.deprecated == 'true'
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          DEPRECATION_DATE: ${{ steps.deprecation.outputs.deprecation_date }}
          DAYS_REMAINING: ${{ steps.deprecation.outputs.days_remaining }}
          DEPRECATED: ${{ steps.deprecation.outputs.deprecated }}
        run: |

          echo "Sending Teams notification..."

          if [ "$DEPRECATED" = "true" ]; then

            MESSAGE="⚠️ GitHub Actions Runner Deprecation Warning"

            DETAILS="Current Version: $CURRENT_VERSION
          Latest Version: $LATEST_VERSION
          Deprecation Date: $DEPRECATION_DATE
          Days Remaining: $DAYS_REMAINING

          Please update the runner image."

          else

            MESSAGE="🔔 GitHub Actions Runner Update Available"

            DETAILS="Current Version: $CURRENT_VERSION
          Latest Version: $LATEST_VERSION

          A newer GitHub Actions Runner version is available.
          Please consider updating the runner image."

          fi

          jq -n \
            --arg title "$MESSAGE" \
            --arg details "$DETAILS" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  contentUrl: null,
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.2",
                    body: [
                      {
                        type: "TextBlock",
                        text: $title,
                        weight: "Bolder",
                        size: "Medium",
                        wrap: true
                      },
                      {
                        type: "TextBlock",
                        text: $details,
                        wrap: true
                      }
                    ]
                  }
                }
              ]
            }' > teams-payload.json

          echo "Sending payload to Teams..."

          HTTP_STATUS=$(curl -sL \
            -o teams-response.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @teams-payload.json \
            "$TEAMS_WEBHOOK_URL")

          echo "Teams HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Teams notification failed."
            cat teams-response.txt
            exit 1
          fi

          echo "Teams notification sent successfully."

      - name: No notification required
        if: steps.compare.outputs.update_available == 'false' && steps.deprecation.outputs.deprecated == 'false'
        shell: bash
        run: |
          echo "Runner is up to date and has no EOL record."
          echo "No Teams notification required."
