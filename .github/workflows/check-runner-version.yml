name: Check Runner Version

on:
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Get current runner version from Dockerfile
      # --------------------------------------------------
      - name: Get current runner version
        id: current
        shell: bash
        run: |
          VERSION=$(grep -oP 'ARG RUNNER_VERSION="\K[^"]+' Dockerfile)

          if [ -z "$VERSION" ]; then
            echo "ERROR: RUNNER_VERSION not found in Dockerfile"
            exit 1
          fi

          echo "Current Runner Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Get latest GitHub Actions Runner version
      # --------------------------------------------------
      - name: Get latest runner version
        id: latest
        shell: bash
        run: |
          LATEST=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/actions/runner/releases/latest" \
            | jq -r '.tag_name' \
            | sed 's/^v//')

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "ERROR: Unable to retrieve latest runner version"
            exit 1
          fi

          echo "Latest Runner Version: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Compare current and latest versions
      # --------------------------------------------------
      - name: Compare versions
        id: compare
        shell: bash
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          echo "Current Version: $CURRENT"
          echo "Latest Version: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Runner is up to date."
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLDEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n 1)

          if [ "$OLDEST" = "$CURRENT" ]; then
            echo "A newer runner version is available."
            echo "update_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Current version is newer than latest release."
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------
      # Get deprecation information
      # --------------------------------------------------
      - name: Check deprecation schedule
        id: deprecation
        shell: bash
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          echo "Checking deprecation schedule..."
          echo ""
          echo "Repository: $REPOSITORY"
          echo "Runner Version: $CURRENT_VERSION"
          echo ""

          URL="https://api.github.com/repos/$REPOSITORY/actions/runners/deprecations/$CURRENT_VERSION"

          HTTP_STATUS=$(curl -sS \
            -L \
            -o deprecation.json \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$URL")

          echo "GitHub API HTTP Status: $HTTP_STATUS"
          echo ""

          if [ "$HTTP_STATUS" = "200" ]; then

            cat deprecation.json
            echo ""

            DEPRECATION_DATE=$(jq -r '.runtime_deprecates_at // empty' deprecation.json)

            if [ -z "$DEPRECATION_DATE" ]; then
              echo "No deprecation date returned."
              echo "has_deprecation=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            DEPRECATION_DATE_ONLY=$(echo "$DEPRECATION_DATE" | cut -d'T' -f1)

            TODAY=$(date -u +"%Y-%m-%d")

            TODAY_SECONDS=$(date -d "$TODAY" +%s)
            DEPRECATION_SECONDS=$(date -d "$DEPRECATION_DATE_ONLY" +%s)

            DIFFERENCE=$((DEPRECATION_SECONDS - TODAY_SECONDS))
            DAYS_REMAINING=$((DIFFERENCE / 86400))

            echo "Deprecation Date: $DEPRECATION_DATE_ONLY"
            echo "Days Remaining: $DAYS_REMAINING"

            echo "has_deprecation=true" >> "$GITHUB_OUTPUT"
            echo "deprecation_date=$DEPRECATION_DATE_ONLY" >> "$GITHUB_OUTPUT"
            echo "days_remaining=$DAYS_REMAINING" >> "$GITHUB_OUTPUT"

          elif [ "$HTTP_STATUS" = "404" ]; then

            echo "No EOL record found for runner version $CURRENT_VERSION."
            echo "has_deprecation=false" >> "$GITHUB_OUTPUT"

          elif [ "$HTTP_STATUS" = "401" ]; then

            echo "ERROR: Bad credentials."
            echo "Check the RUNNER_TOKEN secret."
            exit 1

          elif [ "$HTTP_STATUS" = "403" ]; then

            echo "ERROR: Token does not have sufficient permission."
            echo "Required: Administration -> Read-only"
            exit 1

          else

            echo "ERROR: GitHub API returned HTTP $HTTP_STATUS"
            cat deprecation.json
            exit 1

          fi

      # --------------------------------------------------
      # Display result
      # --------------------------------------------------
      - name: Display runner status
        shell: bash
        run: |
          echo "=========================================="
          echo "GitHub Actions Runner Status"
          echo "=========================================="

          echo "Current Version : ${{ steps.current.outputs.version }}"
          echo "Latest Version  : ${{ steps.latest.outputs.version }}"

          if [ "${{ steps.deprecation.outputs.has_deprecation }}" = "true" ]; then
            echo "Deprecation Date : ${{ steps.deprecation.outputs.deprecation_date }}"
            echo "Days Remaining   : ${{ steps.deprecation.outputs.days_remaining }}"
          else
            echo "Deprecation Date : No EOL record"
          fi

          echo "=========================================="

      # --------------------------------------------------
      # Send Teams notification
      # --------------------------------------------------
      - name: Send Teams notification
        if: |
          steps.compare.outputs.update_available == 'true' ||
          steps.deprecation.outputs.has_deprecation == 'true'
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          DEPRECATION_DATE: ${{ steps.deprecation.outputs.deprecation_date }}
          DAYS_REMAINING: ${{ steps.deprecation.outputs.days_remaining }}
          HAS_DEPRECATION: ${{ steps.deprecation.outputs.has_deprecation }}
        run: |
          if [ "$HAS_DEPRECATION" = "true" ]; then

            TITLE="⚠️ GitHub Actions Runner Deprecation Warning"

            DETAILS="Current Version: $CURRENT_VERSION
          Latest Version: $LATEST_VERSION
          Deprecation Date: $DEPRECATION_DATE
          Days Remaining: $DAYS_REMAINING

          Please update the runner image."

          else

            TITLE="🔔 GitHub Actions Runner Update Available"

            DETAILS="Current Version: $CURRENT_VERSION
          Latest Version: $LATEST_VERSION

          A newer GitHub Actions Runner version is available.
          Please update the runner image."

          fi

          echo "Sending Teams notification..."
          echo ""
          echo "$TITLE"
          echo "$DETAILS"

          jq -n \
            --arg title "$TITLE" \
            --arg details "$DETAILS" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  contentUrl: null,
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.2",
                    body: [
                      {
                        type: "TextBlock",
                        text: $title,
                        weight: "Bolder",
                        size: "Medium",
                        wrap: true
                      },
                      {
                        type: "TextBlock",
                        text: $details,
                        wrap: true
                      }
                    ]
                  }
                }
              ]
            }' > teams-payload.json

          HTTP_STATUS=$(curl -sS \
            -L \
            -o teams-response.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @teams-payload.json \
            "$TEAMS_WEBHOOK_URL")

          echo "Teams HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Teams notification failed."
            cat teams-response.txt
            exit 1
          fi

          echo "Teams notification sent successfully."

      # --------------------------------------------------
      # No notification
      # --------------------------------------------------
      - name: No notification required
        if: |
          steps.compare.outputs.update_available == 'false' &&
          steps.deprecation.outputs.has_deprecation == 'false'
        shell: bash
        run: |
          echo "Runner is up to date."
          echo "No deprecation record found."
          echo "No Teams notification required."
