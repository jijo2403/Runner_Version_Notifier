name: Check Runner Version

on:
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract current version from Dockerfile
        id: current
        run: |
          VERSION=$(grep -oP 'ARG RUNNER_VERSION="\K[^"]+' Dockerfile)
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest released version
        id: latest
        run: |
          LATEST=$(curl -sL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "Latest version: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Compare versions and notify
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Versions match — nothing to notify. Ending here."
            exit 0
          fi

          OLDEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n1)

          if [ "$OLDEST" != "$CURRENT" ]; then
            echo "Current version is newer than latest — not a downgrade. Ending here."
            exit 0
          fi

          echo "Downgrade detected. Sending Teams notification."
          curl -H "Content-Type: application/json" -d '{
            "text": "🔔 **Runner agent update available**\n\nCurrent version in Dockerfile: `'"$CURRENT"'`\nLatest available version: `'"$LATEST"'`"
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"
