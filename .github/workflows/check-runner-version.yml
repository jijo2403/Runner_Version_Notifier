name: Check Runner Version and Deprecation

on:
  workflow_dispatch:

  schedule:
    # Runs every day at 9:00 UTC
    - cron: "0 9 * * *"

jobs:
  check-runner:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Get current runner version from Dockerfile
      # ==========================================================
      - name: Get current runner version
        id: current
        run: |

          echo "Reading runner version from Dockerfile..."

          VERSION=$(grep -oP 'ARG RUNNER_VERSION="\K[^"]+' Dockerfile)

          if [ -z "$VERSION" ]; then
            echo "ERROR: RUNNER_VERSION not found in Dockerfile."
            exit 1
          fi

          echo "Current Runner Version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 3. Get latest GitHub Actions Runner version
      # ==========================================================
      - name: Get latest runner version
        id: latest
        run: |

          echo "Checking latest GitHub Actions Runner release..."

          RESPONSE=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/actions/runner/releases/latest")

          HTTP_STATUS=$(echo "$RESPONSE" \
            | grep "HTTP_STATUS:" \
            | cut -d: -f2)

          JSON=$(echo "$RESPONSE" \
            | sed '/HTTP_STATUS:/d')

          echo "GitHub API HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Unable to retrieve latest runner version."
            echo "$JSON"
            exit 1
          fi

          LATEST=$(echo "$JSON" \
            | jq -r '.tag_name' \
            | sed 's/^v//')

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "ERROR: Latest runner version was not found."
            exit 1
          fi

          echo "Latest Runner Version: $LATEST"

          echo "version=$LATEST" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 4. Compare current and latest versions
      # ==========================================================
      - name: Compare runner versions
        id: comparison
        run: |

          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          echo "Current Version: $CURRENT"
          echo "Latest Version: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then

            echo "status=up-to-date" >> "$GITHUB_OUTPUT"

            echo "Runner is already using the latest version."

          else

            OLDEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n1)

            if [ "$OLDEST" = "$CURRENT" ]; then

              echo "status=update-available" >> "$GITHUB_OUTPUT"

              echo "Runner version update is available."

            else

              echo "status=current-newer" >> "$GITHUB_OUTPUT"

              echo "Current runner version is newer than latest release."

            fi

          fi


      # ==========================================================
      # 5. Get runner deprecation information
      # ==========================================================
      #
      # IMPORTANT:
      # A 404 does NOT fail the workflow.
      #
      # It means GitHub did not return a deprecation record
      # for this repository/version combination.
      #
      # ==========================================================
      - name: Get runner deprecation information
        id: deprecation
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          REPOSITORY: ${{ github.repository }}

        run: |

          echo "Checking deprecation schedule..."
          echo ""
          echo "Repository: $REPOSITORY"
          echo "Runner Version: $CURRENT_VERSION"
          echo ""

          HTTP_STATUS=$(curl -sS \
            -o deprecation.json \
            -w "%{http_code}" \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runners/deprecations/${CURRENT_VERSION}")

          echo "GitHub API HTTP Status: $HTTP_STATUS"
          echo ""
          echo "GitHub API Response:"
          cat deprecation.json
          echo ""

          # ------------------------------------------------------
          # API returned deprecation information
          # ------------------------------------------------------
          if [ "$HTTP_STATUS" = "200" ]; then

            echo "Deprecation information found."

            DEPRECATION_DATE=$(jq -r '.runtime_deprecates_at // empty' deprecation.json)

            if [ -n "$DEPRECATION_DATE" ]; then

              echo "Deprecation Date: $DEPRECATION_DATE"

              echo "has_date=true" >> "$GITHUB_OUTPUT"
              echo "deprecation_date=$DEPRECATION_DATE" >> "$GITHUB_OUTPUT"

            else

              echo "No runtime deprecation date returned."

              echo "has_date=false" >> "$GITHUB_OUTPUT"

            fi

          # ------------------------------------------------------
          # API returned 404
          # ------------------------------------------------------
          elif [ "$HTTP_STATUS" = "404" ]; then

            echo "No deprecation record was returned by GitHub."
            echo "This does NOT mean the runner is deprecated."
            echo "Continuing workflow..."

            echo "has_date=false" >> "$GITHUB_OUTPUT"

          # ------------------------------------------------------
          # Authentication / permission problem
          # ------------------------------------------------------
          elif [ "$HTTP_STATUS" = "401" ]; then

            echo "ERROR: GitHub authentication failed."
            echo "Check the RUNNER_TOKEN secret."

            exit 1

          elif [ "$HTTP_STATUS" = "403" ]; then

            echo "ERROR: GitHub denied access to the deprecation API."
            echo ""
            echo "Check that the fine-grained PAT has:"
            echo "Administration -> Read-only"
            echo "for this repository."

            exit 1

          # ------------------------------------------------------
          # Other API error
          # ------------------------------------------------------
          else

            echo "WARNING: GitHub returned HTTP $HTTP_STATUS."
            echo "Deprecation information will not be used."
            echo "Continuing workflow..."

            echo "has_date=false" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================================
      # 6. Calculate days remaining
      # ==========================================================
      - name: Calculate deprecation status
        id: calculate
        if: steps.deprecation.outputs.has_date == 'true'
        env:
          DEPRECATION_DATE: ${{ steps.deprecation.outputs.deprecation_date }}

        run: |

          echo "Calculating deprecation status..."

          TODAY=$(date -u +%s)

          DEPRECATION=$(date -u \
            -d "$DEPRECATION_DATE" \
            +%s)

          DIFFERENCE=$((DEPRECATION - TODAY))

          DAYS_REMAINING=$((DIFFERENCE / 86400))

          echo "Today: $(date -u)"
          echo "Deprecation Date: $DEPRECATION_DATE"
          echo "Days Remaining: $DAYS_REMAINING"

          echo "days_remaining=$DAYS_REMAINING" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 7. Display complete status
      # ==========================================================
      - name: Display runner status
        run: |

          echo "=============================================="
          echo "       GitHub Actions Runner Status"
          echo "=============================================="

          echo "Current Version : ${{ steps.current.outputs.version }}"
          echo "Latest Version  : ${{ steps.latest.outputs.version }}"

          if [ "${{ steps.deprecation.outputs.has_date }}" = "true" ]; then

            echo "Deprecation Date : ${{ steps.deprecation.outputs.deprecation_date }}"
            echo "Days Remaining   : ${{ steps.calculate.outputs.days_remaining }}"

          else

            echo "Deprecation Date : Not available from API"

          fi

          echo "=============================================="


      # ==========================================================
      # 8. Send Teams notification
      # ==========================================================
      #
      # Notification is sent when:
      #
      # A. New runner version is available
      #
      # OR
      #
      # B. Runner is within 30 days of deprecation
      #
      # ==========================================================
      - name: Send Teams notification
        if: |
          steps.comparison.outputs.status == 'update-available' ||
          (
            steps.deprecation.outputs.has_date == 'true' &&
            steps.calculate.outputs.days_remaining <= 30
          )

        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          DEPRECATION_DATE: ${{ steps.deprecation.outputs.deprecation_date }}
          DAYS_REMAINING: ${{ steps.calculate.outputs.days_remaining }}
          HAS_DEPRECATION_DATE: ${{ steps.deprecation.outputs.has_date }}

        run: |

          echo "Preparing Teams notification..."

          # ------------------------------------------------------
          # Determine notification type
          # ------------------------------------------------------

          if [ "$HAS_DEPRECATION_DATE" = "true" ] && [ "$DAYS_REMAINING" -lt 0 ]; then

            TITLE="🚨 GitHub Actions Runner Deprecated"
            MESSAGE="The current runner version has passed its runtime deprecation date."

          elif [ "$HAS_DEPRECATION_DATE" = "true" ] && [ "$DAYS_REMAINING" -eq 0 ]; then

            TITLE="🚨 GitHub Actions Runner Deprecation Today"
            MESSAGE="The current runner version reaches runtime deprecation today."

          elif [ "$HAS_DEPRECATION_DATE" = "true" ] && [ "$DAYS_REMAINING" -le 7 ]; then

            TITLE="🚨 GitHub Actions Runner Deprecation Warning"
            MESSAGE="The current runner version will reach runtime deprecation within 7 days."

          elif [ "$HAS_DEPRECATION_DATE" = "true" ] && [ "$DAYS_REMAINING" -le 30 ]; then

            TITLE="⚠️ GitHub Actions Runner Deprecation Warning"
            MESSAGE="The current runner version is within 30 days of runtime deprecation."

          else

            TITLE="🔔 GitHub Actions Runner Update Available"
            MESSAGE="A newer GitHub Actions Runner version is available."

          fi


          echo "Title: $TITLE"
          echo "Message: $MESSAGE"


          # ------------------------------------------------------
          # Build Adaptive Card
          # ------------------------------------------------------

          if [ "$HAS_DEPRECATION_DATE" = "true" ]; then

            CARD=$(cat <<EOF
{
  "type": "message",
  "attachments": [
    {
      "contentType": "application/vnd.microsoft.card.adaptive",
      "contentUrl": null,
      "content": {
        "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
        "type": "AdaptiveCard",
        "version": "1.2",
        "body": [
          {
            "type": "TextBlock",
            "text": "$TITLE",
            "weight": "Bolder",
            "size": "Medium",
            "wrap": true
          },
          {
            "type": "TextBlock",
            "text": "$MESSAGE",
            "wrap": true
          },
          {
            "type": "FactSet",
            "facts": [
              {
                "title": "Current Version:",
                "value": "$CURRENT_VERSION"
              },
              {
                "title": "Latest Version:",
                "value": "$LATEST_VERSION"
              },
              {
                "title": "Deprecation Date:",
                "value": "$DEPRECATION_DATE"
              },
              {
                "title": "Days Remaining:",
                "value": "$DAYS_REMAINING"
              }
            ]
          },
          {
            "type": "TextBlock",
            "text": "Please update the runner version in the Dockerfile and rebuild the runner image.",
            "wrap": true
          }
        ]
      }
    }
  ]
}
EOF
)

          else

            CARD=$(cat <<EOF
{
  "type": "message",
  "attachments": [
    {
      "contentType": "application/vnd.microsoft.card.adaptive",
      "contentUrl": null,
      "content": {
        "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
        "type": "AdaptiveCard",
        "version": "1.2",
        "body": [
          {
            "type": "TextBlock",
            "text": "$TITLE",
            "weight": "Bolder",
            "size": "Medium",
            "wrap": true
          },
          {
            "type": "TextBlock",
            "text": "$MESSAGE",
            "wrap": true
          },
          {
            "type": "FactSet",
            "facts": [
              {
                "title": "Current Version:",
                "value": "$CURRENT_VERSION"
              },
              {
                "title": "Latest Version:",
                "value": "$LATEST_VERSION"
              }
            ]
          },
          {
            "type": "TextBlock",
            "text": "Deprecation information is not currently available from the GitHub API for this version.",
            "wrap": true
          }
        ]
      }
    }
  ]
}
EOF
)

          fi


          # ------------------------------------------------------
          # Send to Teams
          # ------------------------------------------------------

          echo "Sending Teams notification..."

          RESPONSE=$(curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$CARD" \
            -w "\nHTTP_STATUS:%{http_code}" \
            "$TEAMS_WEBHOOK_URL")

          echo ""
          echo "Teams response:"
          echo "$RESPONSE"

          HTTP_STATUS=$(echo "$RESPONSE" \
            | grep "HTTP_STATUS:" \
            | cut -d: -f2)

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then

            echo "ERROR: Teams webhook returned HTTP $HTTP_STATUS"

            exit 1

          fi

          echo "Teams notification sent successfully."
