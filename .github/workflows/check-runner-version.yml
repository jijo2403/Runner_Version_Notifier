name: Check Runner Version

on:
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extract current runner version from Dockerfile
      - name: Extract current version from Dockerfile
        id: current
        run: |
          VERSION=$(grep -oP 'ARG RUNNER_VERSION="\K[^"]+' Dockerfile)

          echo "Current version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Get latest GitHub Actions Runner version
      - name: Get latest released version
        id: latest
        run: |
          LATEST=$(curl -sL \
            https://api.github.com/repos/actions/runner/releases/latest \
            | jq -r '.tag_name' \
            | sed 's/^v//')

          echo "Latest version: $LATEST"

          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      # Compare versions
      - name: Compare versions and notify
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          echo "Current version: $CURRENT"
          echo "Latest version: $LATEST"

          # Versions are the same
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Versions match — nothing to notify."
            exit 0
          fi

          # Check whether current version is newer than latest
          OLDEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n1)

          if [ "$OLDEST" != "$CURRENT" ]; then
            echo "Current version is newer than latest."
            echo "No notification required."
            exit 0
          fi

          echo "Runner version update available."
          echo "Current version: $CURRENT"
          echo "Latest version: $LATEST"

          # Send notification to Microsoft Teams
          echo "Sending Teams notification..."

          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"🔔 Runner agent update available\\n\\nCurrent version in Dockerfile: $CURRENT\\nLatest available version: $LATEST\"
            }" \
            -w "\nHTTP_STATUS:%{http_code}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}")

          echo "Teams response:"
          echo "$RESPONSE"
