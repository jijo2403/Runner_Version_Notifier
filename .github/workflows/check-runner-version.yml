name: Check Runner Version

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"

jobs:
  check-version:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current runner version
        id: current
        shell: bash
        run: |
          VERSION=$(grep -oP 'ARG RUNNER_VERSION="\K[^"]+' Dockerfile)

          if [ -z "$VERSION" ]; then
            echo "ERROR: RUNNER_VERSION not found in Dockerfile"
            exit 1
          fi

          echo "Current Runner Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest runner version
        id: latest
        shell: bash
        run: |
          LATEST=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/actions/runner/releases/latest \
            | jq -r '.tag_name' \
            | sed 's/^v//')

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "ERROR: Could not get latest runner version"
            exit 1
          fi

          echo "Latest Runner Version: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: comparison
        shell: bash
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          echo "Current Version: $CURRENT"
          echo "Latest Version: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Runner is up to date."
            exit 0
          fi

          OLDEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n1)

          if [ "$OLDEST" = "$CURRENT" ]; then
            echo "status=update-available" >> "$GITHUB_OUTPUT"
            echo "New runner version is available."
          else
            echo "status=current-newer" >> "$GITHUB_OUTPUT"
            echo "Current version is newer than latest release."
          fi

      - name: Check deprecation schedule
        id: deprecation
        shell: bash
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          REPOSITORY="${{ github.repository }}"
          VERSION="${{ steps.current.outputs.version }}"

          echo "Checking deprecation schedule..."
          echo ""
          echo "Repository: $REPOSITORY"
          echo "Runner Version: $VERSION"
          echo ""

          HTTP_STATUS=$(curl -sS \
            -o deprecation.json \
            -w "%{http_code}" \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RUNNER_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REPOSITORY/actions/runners/deprecations/$VERSION")

          echo "GitHub API HTTP Status: $HTTP_STATUS"
          echo ""
          cat deprecation.json
          echo ""

          if [ "$HTTP_STATUS" = "200" ]; then

            DEPRECATION_DATE=$(jq -r '.runtime_deprecates_at // empty' deprecation.json)

            if [ -n "$DEPRECATION_DATE" ]; then
              echo "Deprecation Date: $DEPRECATION_DATE"
              echo "has_date=true" >> "$GITHUB_OUTPUT"
              echo "deprecation_date=$DEPRECATION_DATE" >> "$GITHUB_OUTPUT"
            else
              echo "No deprecation date returned."
              echo "has_date=false" >> "$GITHUB_OUTPUT"
            fi

          elif [ "$HTTP_STATUS" = "404" ]; then

            echo "No deprecation information found for this version."
            echo "Continuing workflow..."
            echo "has_date=false" >> "$GITHUB_OUTPUT"

          elif [ "$HTTP_STATUS" = "401" ]; then

            echo "ERROR: Invalid RUNNER_TOKEN."
            exit 1

          elif [ "$HTTP_STATUS" = "403" ]; then

            echo "ERROR: Token does not have permission to access the API."
            echo "Required permission: Administration -> Read-only"
            exit 1

          else

            echo "WARNING: GitHub returned HTTP $HTTP_STATUS"
            echo "Continuing without deprecation information."
            echo "has_date=false" >> "$GITHUB_OUTPUT"

          fi

      - name: Calculate days remaining
        id: calculate
        if: steps.deprecation.outputs.has_date == 'true'
        shell: bash
        run: |
          DEPRECATION_DATE="${{ steps.deprecation.outputs.deprecation_date }}"

          TODAY=$(date -u +%s)
          DEPRECATION=$(date -u -d "$DEPRECATION_DATE" +%s)

          DIFFERENCE=$((DEPRECATION - TODAY))
          DAYS_REMAINING=$((DIFFERENCE / 86400))

          echo "Deprecation Date: $DEPRECATION_DATE"
          echo "Days Remaining: $DAYS_REMAINING"

          echo "days_remaining=$DAYS_REMAINING" >> "$GITHUB_OUTPUT"

      - name: Display result
        run: |
          echo "========================================"
          echo "GitHub Actions Runner Status"
          echo "========================================"

          echo "Current Version : ${{ steps.current.outputs.version }}"
          echo "Latest Version  : ${{ steps.latest.outputs.version }}"

          if [ "${{ steps.deprecation.outputs.has_date }}" = "true" ]; then
            echo "Deprecation Date : ${{ steps.deprecation.outputs.deprecation_date }}"
            echo "Days Remaining   : ${{ steps.calculate.outputs.days_remaining }}"
          else
            echo "Deprecation Date : Not available"
          fi

          echo "========================================"

      - name: Send Teams notification
        if: |
          steps.comparison.outputs.status == 'update-available' ||
          (
            steps.deprecation.outputs.has_date == 'true' &&
            steps.calculate.outputs.days_remaining <= 30
          )
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          DEPRECATION_DATE: ${{ steps.deprecation.outputs.deprecation_date }}
          DAYS_REMAINING: ${{ steps.calculate.outputs.days_remaining }}
          HAS_DEPRECATION_DATE: ${{ steps.deprecation.outputs.has_date }}
        shell: bash
        run: |
          if [ "$HAS_DEPRECATION_DATE" = "true" ]; then

            MESSAGE="⚠️ GitHub Actions Runner Deprecation Warning

          Current Version: $CURRENT_VERSION
          Latest Version: $LATEST_VERSION
          Deprecation Date: $DEPRECATION_DATE
          Days Remaining: $DAYS_REMAINING

          Please update the runner image."

          else

            MESSAGE="🔔 GitHub Actions Runner Update Available

          Current Version: $CURRENT_VERSION
          Latest Version: $LATEST_VERSION

          A newer runner version is available.
          Please review and update the runner image."

          fi

          echo "$MESSAGE"

          PAYLOAD=$(jq -n \
            --arg message "$MESSAGE" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.2",
                    body: [
                      {
                        type: "TextBlock",
                        text: $message,
                        wrap: true
                      }
                    ]
                  }
                }
              ]
            }')

          HTTP_STATUS=$(curl -sS \
            -o teams-response.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$TEAMS_WEBHOOK_URL")

          echo "Teams HTTP Status: $HTTP_STATUS"
          cat teams-response.txt

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Teams notification failed."
            exit 1
          fi

          echo "Teams notification sent successfully."
