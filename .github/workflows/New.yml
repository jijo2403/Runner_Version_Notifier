name: new Runner Version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Extract current runner version from Dockerfile
      # ---------------------------------------------------------
      - name: Extract current runner version
        id: current
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(grep -oP 'ARG RUNNER_VERSION="\K[^"]+' Dockerfile)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not find RUNNER_VERSION in Dockerfile"
            exit 1
          fi

          echo "Current runner version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 3. Get GitHub Actions Runner releases
      # ---------------------------------------------------------
      - name: Get runner releases
        id: releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          set -euo pipefail

          HTTP_STATUS=$(curl -sS \
            -o releases.json \
            -w "%{http_code}" \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/actions/runner/releases?per_page=100")

          echo "GitHub API HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Unable to retrieve GitHub Actions Runner releases"
            cat releases.json
            exit 1
          fi

          echo "Runner releases downloaded successfully."

          jq -r '
            .[]
            | select(.draft == false)
            | select(.prerelease == false)
            | "\(.tag_name) \(.published_at)"
          ' releases.json


      # ---------------------------------------------------------
      # 4. Find the first newer runner version
      # ---------------------------------------------------------
      - name: Determine newer runner version
        id: newer
        shell: bash
        env:
          CURRENT: ${{ steps.current.outputs.version }}
        run: |
          set -euo pipefail

          echo "Current version: $CURRENT"

          NEWER_RELEASE=$(jq -c --arg current "$CURRENT" '
            [
              .[]
              | select(.draft == false)
              | select(.prerelease == false)
              | {
                  version: (.tag_name | sub("^v"; "")),
                  published_at: .published_at
                }
              | select(
                  (
                    .version
                    | split(".")
                    | map(tonumber)
                  )
                  >
                  (
                    $current
                    | split(".")
                    | map(tonumber)
                  )
                )
            ]
            | sort_by(
                .version
                | split(".")
                | map(tonumber)
              )
            | .[0]
          ' releases.json)

          if [ "$NEWER_RELEASE" = "null" ] || [ -z "$NEWER_RELEASE" ]; then
            echo "No newer runner version found."

            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION=$(echo "$NEWER_RELEASE" | jq -r '.version')
          RELEASE_DATE=$(echo "$NEWER_RELEASE" | jq -r '.published_at')

          echo "Newer version: $NEW_VERSION"
          echo "Release date: $RELEASE_DATE"

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 5. Calculate how old the newer version is
      # ---------------------------------------------------------
      - name: Calculate update age
        id: age
        if: steps.newer.outputs.available == 'true'
        shell: bash
        env:
          RELEASE_DATE: ${{ steps.newer.outputs.release_date }}
        run: |
          set -euo pipefail

          RELEASE_EPOCH=$(date -d "$RELEASE_DATE" +%s)
          NOW_EPOCH=$(date -u +%s)

          AGE_SECONDS=$((NOW_EPOCH - RELEASE_EPOCH))
          AGE_DAYS=$((AGE_SECONDS / 86400))

          echo "Release date: $RELEASE_DATE"
          echo "Days since release: $AGE_DAYS"

          echo "days=$AGE_DAYS" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 6. Determine notification level
      # ---------------------------------------------------------
      - name: Determine notification level
        id: notification
        if: steps.newer.outputs.available == 'true'
        shell: bash
        env:
          DAYS: ${{ steps.age.outputs.days }}
        run: |
          set -euo pipefail

          if [ "$DAYS" -ge 30 ]; then
            LEVEL="CRITICAL"
          elif [ "$DAYS" -ge 25 ]; then
            LEVEL="CRITICAL"
          elif [ "$DAYS" -ge 21 ]; then
            LEVEL="URGENT"
          elif [ "$DAYS" -ge 14 ]; then
            LEVEL="WARNING"
          else
            LEVEL="NONE"
          fi

          echo "Notification level: $LEVEL"

          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 7. Send Microsoft Teams notification
      # ---------------------------------------------------------
      - name: Notify Teams
        if: |
          steps.newer.outputs.available == 'true' &&
          steps.notification.outputs.level != 'NONE'
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CURRENT: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.newer.outputs.version }}
          RELEASE_DATE: ${{ steps.newer.outputs.release_date }}
          DAYS: ${{ steps.age.outputs.days }}
          LEVEL: ${{ steps.notification.outputs.level }}
        run: |
          set -euo pipefail

          if [ "$LEVEL" = "WARNING" ]; then
            TITLE="🟡 GitHub Actions Runner Warning"
          elif [ "$LEVEL" = "URGENT" ]; then
            TITLE="🟠 GitHub Actions Runner Urgent"
          else
            TITLE="🔴 GitHub Actions Runner Critical"
          fi

          DAYS_REMAINING=$((30 - DAYS))

          if [ "$DAYS_REMAINING" -lt 0 ]; then
            DAYS_REMAINING=0
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg current "$CURRENT" \
            --arg latest "$NEW_VERSION" \
            --arg release_date "$RELEASE_DATE" \
            --arg days "$DAYS" \
            --arg remaining "$DAYS_REMAINING" \
            --arg level "$LEVEL" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  contentUrl: null,
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.2",
                    body: [
                      {
                        type: "TextBlock",
                        text: $title,
                        weight: "Bolder",
                        size: "Medium",
                        wrap: true
                      },
                      {
                        type: "TextBlock",
                        text: "Your self-hosted GitHub Actions runner has a newer software version available.",
                        wrap: true
                      },
                      {
                        type: "FactSet",
                        facts: [
                          {
                            title: "Current Version:",
                            value: $current
                          },
                          {
                            title: "Latest Version:",
                            value: $latest
                          },
                          {
                            title: "Release Date:",
                            value: $release_date
                          },
                          {
                            title: "Days Since Release:",
                            value: $days
                          },
                          {
                            title: "Approx. Days Remaining:",
                            value: $remaining
                          },
                          {
                            title: "Severity:",
                            value: $level
                          }
                        ]
                      },
                      {
                        type: "TextBlock",
                        text: "Please update the runner Docker image.",
                        wrap: true,
                        weight: "Bolder"
                      }
                    ]
                  }
                }
              ]
            }')

          echo "Sending Teams notification..."

          HTTP_STATUS=$(curl -sS \
            -o teams-response.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$TEAMS_WEBHOOK_URL")

          echo "Teams HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Teams notification failed."
            cat teams-response.txt
            exit 1
          fi

          echo "Teams notification sent successfully."
